name: Cut Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number without the v prefix (e.g. 0.2.3)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Create the tag and release

    steps:
      - name: Validate version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 0.2.3, got '${{ inputs.version }}'"
            exit 1
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Creates the v-prefixed tag on the default branch HEAD and opens a
          # release with auto-generated notes. The tag push triggers build.yaml,
          # which builds the DMG and updates the Homebrew cask.
          gh release create "v${{ inputs.version }}" --generate-notes
