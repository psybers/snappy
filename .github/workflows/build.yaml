name: Build and Sign macOS App

on:
  push:
    tags:
      - 'v*'

env:
  # The only app-specific value in this file. The cask name is derived
  # from the repository name, so it must match Casks/<repo>.rb in the tap.
  APP_NAME: Snappy

jobs:
  build-macos:
    runs-on: macos-latest

    permissions:
      contents: write  # Gives permission to upload files to Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build App
        run: |
          xcodebuild archive \
            -project ${APP_NAME}.xcodeproj \
            -scheme ${APP_NAME} \
            -configuration Release \
            -archivePath $RUNNER_TEMP/${APP_NAME}.xcarchive \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Extract build .app from archive wrapper
        run: |
          mkdir -p build
          cp -R $RUNNER_TEMP/${APP_NAME}.xcarchive/Products/Applications/${APP_NAME}.app build/

      - name: Ad-Hoc Sign Application
        run: |
          # Force an ad-hoc signature ('-') deeply through the bundle
          codesign --force --deep --sign - build/${APP_NAME}.app

      - name: Package into a DMG
        run: |
          # It is highly recommended to distribute as a DMG or a ZIP
          # Install 'create-dmg' via brew on the runner if you want a fancy DMG
          hdiutil create -volname "${APP_NAME} Installer" -format UDZO -srcfolder build/${APP_NAME}.app -ov ${APP_NAME}-${{ github.ref_name }}.dmg

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}
          path: ${{ env.APP_NAME }}-${{ github.ref_name }}.dmg

      - name: Upload DMG to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Uploads the file directly to the release matching current tag
          gh release upload ${{ github.ref_name }} ${{ env.APP_NAME }}-${{ github.ref_name }}.dmg --clobber

  update-cask:
    needs: build-macos
    runs-on: ubuntu-latest

    permissions:
      contents: read  # Download the release asset

    steps:
      - name: Download DMG and compute SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dmg
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.dmg' --dir dmg
          SHA256=$(sha256sum dmg/*.dmg | awk '{print $1}')
          VERSION="${TAG#v}"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check out tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/psybers/homebrew-tap.git" tap

      - name: Update cask and push
        run: |
          cd tap
          CASK="${GITHUB_REPOSITORY##*/}"
          sed -i "s/^  version \".*\"/  version \"$VERSION\"/" "Casks/${CASK}.rb"
          sed -i "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" "Casks/${CASK}.rb"
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK}.rb"
          git commit -m "add ${{ env.APP_NAME }} $VERSION release"
          git push
